plugins {
    id 'com.github.johnrengelman.shadow'

	id "com.modrinth.minotaur" version "2.+"
	id "com.matthewprenger.cursegradle" version "1.4.0"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

// TODO: infer from neoforge.mods.toml?!
def supportedVersions = ["1.20.6", "1.21"]
def versionSupportName = "(NeoForge 1.20.6+)"

if (System.getenv("MODRINTH_TOKEN")) {
    modrinth {
        token = System.getenv("MODRINTH_TOKEN")
        projectId = rootProject.modrinth_id
        versionNumber = rootProject.mod_version + "+neoforge"
        uploadFile = remapJar
        gameVersions = supportedVersions
        loaders = ["neoforge"]
        detectLoaders = false
        versionName = rootProject.mod_version + " " + versionSupportName
        changelog = rootProject.ext.changelog
    }

    publish.dependsOn(tasks.named("modrinth"))
}

if (System.getenv("CURSEFORGE_TOKEN")) {
    curseforge {
        apiKey = System.getenv("CURSEFORGE_TOKEN")
        project {
            id = rootProject.curseforge_id_forge
            releaseType = "release"

            mainArtifact(remapJar) {
                displayName = rootProject.mod_version + " " + versionSupportName
            }
            for (version in supportedVersions) {
                addGameVersion(version)
            }
            addGameVersion("NeoForge")
            changelog = rootProject.ext.changelog
            changelogType = "markdown"
        }
    }

    publish.dependsOn(tasks.named("curseforge"))
}

configurations {
    remapJarOutput {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    remapJarOutput(remapJar) // For consumption by github release
}
